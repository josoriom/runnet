[package]
name = "runnet"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Run ONNX neural network models in plain Rust, zero dependencies"
license = "MIT"
repository = "https://github.com/josoriom/runnet"
readme = "README.md"
keywords = ["onnx", "neural-network", "inference", "machine-learning"]
categories = ["science"]

[dependencies]

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
